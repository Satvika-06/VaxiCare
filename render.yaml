services:
  - type: web
    name: vaxicare
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: EMAIL_REMINDERS_ENABLED
        value: "false"
      - key: SMS_ENABLED
        value: "false"
      - key: REMINDER_CHECK_INTERVAL_SECONDS
        value: "60"
